global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout check 3s

frontend tienda
    bind :80
    # El frontal HTTP define las cabeceras que Laravel puede confiar.
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Prefix
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto http
    option forwardfor
    default_backend nodos_web

backend nodos_web
    balance roundrobin
    option httpchk GET /up
    http-check expect status 200
    # Reintenta otra conexión si un nodo cae entre dos health checks.
    option redispatch 1
    retries 3
    http-response set-header X-Servido-Por %s
    server nginx-php-fpm web-nginx:80 check inter 2s fall 3 rise 2
    server apache-mod-php apache-php:80 check inter 2s fall 3 rise 2

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
    stats auth "admin:${HAPROXY_STATS_PASSWORD}"
