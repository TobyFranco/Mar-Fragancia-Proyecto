# Mismo límite de procesos PHP que PHP-FPM (docker/php/procesos.conf),
# para que la comparación entre arquitecturas sea justa.
<IfModule mpm_prefork_module>
    StartServers            20
    MinSpareServers         20
    MaxSpareServers         20
    ServerLimit             20
    MaxRequestWorkers       20
    MaxConnectionsPerChild  0
</IfModule>
