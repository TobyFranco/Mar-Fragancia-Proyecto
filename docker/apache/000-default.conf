<VirtualHost *:80>
    DocumentRoot /var/www/public
    <Directory /var/www/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    Header always set X-Nodo "apache-mod-php"
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
